name: Build & Push Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker 标签'
        required: false
        default: 'latest'
        type: string
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write
  actions: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            os: ubuntu-latest
          - platform: linux/arm64
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}

    steps:
      - name: Prepare platform name
        run: |
          echo "PLATFORM_NAME=${{ matrix.platform }}" | sed 's|/|-|g' >> $GITHUB_ENV

      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/mtvpls/moontvplus
          tags: |
            type=raw,value=${{ github.event.inputs.tag || 'latest' }},enable={{is_default_branch}}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          tags: ghcr.io/mtvpls/moontvplus:${{ github.event.inputs.tag || 'latest' }}
          outputs: type=image,name=ghcr.io/mtvpls/moontvplus,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Get image size
        id: size
        run: |
          # 获取刚推送的镜像大小
          IMAGE_REF="ghcr.io/mtvpls/moontvplus@${{ steps.build.outputs.digest }}"
          
          # 使用 docker buildx imagetools inspect 获取镜像信息
          MANIFEST=$(docker buildx imagetools inspect --raw $IMAGE_REF)
          
          # 计算总大小
          TOTAL_SIZE=$(echo "$MANIFEST" | jq '[.layers[]?.size // 0, .config.size // 0] | add // 0')
          
          # 转换为人类可读格式
          if [ "$TOTAL_SIZE" -ge 1073741824 ]; then
            SIZE_HUMAN=$(awk "BEGIN {printf \"%.2f GB\", $TOTAL_SIZE/1073741824}")
          elif [ "$TOTAL_SIZE" -ge 1048576 ]; then
            SIZE_HUMAN=$(awk "BEGIN {printf \"%.2f MB\", $TOTAL_SIZE/1048576}")
          elif [ "$TOTAL_SIZE" -ge 1024 ]; then
            SIZE_HUMAN=$(awk "BEGIN {printf \"%.2f KB\", $TOTAL_SIZE/1024}")
          else
            SIZE_HUMAN="${TOTAL_SIZE} bytes"
          fi
          
          echo "size_bytes=$TOTAL_SIZE" >> $GITHUB_OUTPUT
          echo "size_human=$SIZE_HUMAN" >> $GITHUB_OUTPUT
          echo "platform=${{ matrix.platform }}" >> $GITHUB_OUTPUT
          
          echo "📦 Image size for ${{ matrix.platform }}: $SIZE_HUMAN ($TOTAL_SIZE bytes)"

      - name: Upload digest and size info
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_NAME }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Save size metadata
        run: |
          mkdir -p /tmp/sizes
          echo "${{ steps.size.outputs.size_human }}" > "/tmp/sizes/${{ env.PLATFORM_NAME }}.txt"
          echo "${{ steps.size.outputs.size_bytes }}" > "/tmp/sizes/${{ env.PLATFORM_NAME }}.bytes"

      - name: Upload size metadata
        uses: actions/upload-artifact@v4
        with:
          name: sizes-${{ env.PLATFORM_NAME }}
          path: /tmp/sizes/*
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Download size metadata
        uses: actions/download-artifact@v4
        with:
          path: /tmp/sizes
          pattern: sizes-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        id: lowercase
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Prepare size annotations
        id: annotations
        run: |
          cd /tmp/sizes
          
          # 读取各架构大小
          AMD64_SIZE=$(cat linux-amd64.txt 2>/dev/null || echo "N/A")
          ARM64_SIZE=$(cat linux-arm64.txt 2>/dev/null || echo "N/A")
          
          AMD64_BYTES=$(cat linux-amd64.bytes 2>/dev/null || echo "0")
          ARM64_BYTES=$(cat linux-arm64.bytes 2>/dev/null || echo "0")
          
          # 计算总大小
          TOTAL_BYTES=$((AMD64_BYTES + ARM64_BYTES))
          if [ "$TOTAL_BYTES" -ge 1073741824 ]; then
            TOTAL_SIZE=$(awk "BEGIN {printf \"%.2f GB\", $TOTAL_BYTES/1073741824}")
          elif [ "$TOTAL_BYTES" -ge 1048576 ]; then
            TOTAL_SIZE=$(awk "BEGIN {printf \"%.2f MB\", $TOTAL_BYTES/1048576}")
          else
            TOTAL_SIZE=$(awk "BEGIN {printf \"%.2f KB\", $TOTAL_BYTES/1024}")
          fi
          
          # 生成描述
          DESCRIPTION="Multi-arch Docker image | amd64: ${AMD64_SIZE} | arm64: ${ARM64_SIZE} | Total: ${TOTAL_SIZE}"
          
          echo "description=$DESCRIPTION" >> $GITHUB_OUTPUT
          echo "amd64_size=$AMD64_SIZE" >> $GITHUB_OUTPUT
          echo "arm64_size=$ARM64_SIZE" >> $GITHUB_OUTPUT
          echo "total_size=$TOTAL_SIZE" >> $GITHUB_OUTPUT
          
          echo "📊 Image sizes:"
          echo "  - linux/amd64: $AMD64_SIZE"
          echo "  - linux/arm64: $ARM64_SIZE"
          echo "  - Total: $TOTAL_SIZE"

      - name: Create manifest list with annotations
        working-directory: /tmp/digests
        run: |
          # 创建带注解的 manifest
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.description=${{ steps.annotations.outputs.description }}" \
            --annotation "index:org.opencontainers.image.size.amd64=${{ steps.annotations.outputs.amd64_size }}" \
            --annotation "index:org.opencontainers.image.size.arm64=${{ steps.annotations.outputs.arm64_size }}" \
            --annotation "index:org.opencontainers.image.size.total=${{ steps.annotations.outputs.total_size }}" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            -t ghcr.io/mtvpls/moontvplus:${{ github.event.inputs.tag || 'latest' }} \
            $(printf 'ghcr.io/mtvpls/moontvplus@sha256:%s ' *)

      - name: Verify annotations
        run: |
          echo "🔍 Verifying manifest annotations..."
          docker buildx imagetools inspect ghcr.io/mtvpls/moontvplus:${{ github.event.inputs.tag || 'latest' }}

  cleanup-refresh:
    runs-on: ubuntu-latest
    needs:
      - merge
    if: always()
    steps:
      - name: Delete workflow runs
        uses: Mattraks/delete-workflow-runs@main
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          retain_days: 0
          keep_minimum_runs: 2
